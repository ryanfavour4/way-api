<!DOCTYPE html>
<html>

<body style="font-family: Arial, sans-serif; color: #333;">
 <div style="max-width: 600px; margin: auto; border: 1px solid #eee; padding: 20px;">
  <h2 style="color: #89BC06;">Verification Code</h2>
  <p>Hello {{name}},</p>
  <p>You requested a verification code for
   <strong>{{message}}</strong>.
  </p>
  <div
   style="background: #f4f4f4; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; letter-spacing: 5px;">
   {{code}}
  </div>
  <p>This code will expire in 10 minutes. If you did not request this, please
   ignore this email.</p>
  <p>Best regards,<br>Way Navigation 🧭</p>
 </div>
</body>

</html>
