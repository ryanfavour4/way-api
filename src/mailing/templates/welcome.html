<!DOCTYPE html>
<html>

<body style="font-family: sans-serif; color: #333; line-height: 1.6;">
 <div style="max-width: 600px; margin: auto; padding: 20px; border: 1px solid #eee;">
  <h2 style="color: #89BC06;">Welcome to G.E.M Fundraise!</h2>
  <p>Hi {{fullname}},</p>
  <p>We're excited to have you join our platform. Before you get started,
   please verify your email address to secure your account.</p>

  <div style="text-align: center; margin: 30px 0;">
   <a href="{{verifyUrl}}"
    style="background-color: #89BC06; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold;">
    Verify My Email
   </a>
  </div>

  <p>Or copy and paste this link into your browser:</p>
  <p style="font-size: 12px; color: #89BC06;">{{verifyUrl}}</p>

  <p>Thank you,<br>The G.E.M Team</p>
 </div>
</body>

</html>
