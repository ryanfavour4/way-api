<!DOCTYPE html>
<html>
 <body style="font-family: sans-serif; color: #333; line-height: 1.6;">
  <div
   style="max-width: 600px; margin: auto; padding: 20px; border: 1px solid #eee;">
   <h2 style="color: #4A90E2;">Welcome to G.E.M Fundraise!</h2>
   <p>Hi {{fullname}},</p>
   <p>We're excited to have you join our community. Before you get started,
    please verify your email address to secure your account.</p>

   <div style="text-align: center; margin: 30px 0;">
    <a href="{{verifyUrl}}"
     style="background-color: #4A90E2; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold;">
     Verify My Email
    </a>
   </div>

   <p>Or copy and paste this link into your browser:</p>
   <p style="font-size: 12px; color: #888;">{{verifyUrl}}</p>

   <p>Thank you,<br>The G.E.M Team</p>
  </div>
 </body>
</html>
